name: HBB Mutation Analyzer Release Readiness CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  release-readiness-audit:
    name: Automated Release Readiness Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend NPM Dependencies
        run: |
          cd frontend
          npm install

      - name: Prepare Environment Configuration
        run: |
          cp .env.example .env

      - name: Execute Automated Release Readiness Audit
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
          GROQ_MODEL: 'openai/gpt-oss-120b'
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY || '' }}
          NCBI_EMAIL: 'researcher@example.edu'
        run: |
          python tools/release_audit.py

      - name: Archive Release Readiness Audit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-reports
          path: reports/
          retention-days: 30
